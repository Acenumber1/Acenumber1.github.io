<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>p5.js Gallery</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    color: white;
    font-family: Arial, sans-serif;
    background: radial-gradient(
        circle at 50% 60%,
        #1a1a2e 0%,
        #0d0d1a 100%
    );
}

.page-header {
    text-align: center;
    padding: 60px 40px 20px;
}

.page-title {
    font-size: 52px;
    letter-spacing: 2px;
    margin: 0 0 8px;
    font-weight: 700;
}

.page-subtitle {
    font-size: 18px;
    color: rgba(255,255,255,0.45);
    margin: 0;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
    padding: 40px 60px 80px;
}

.tile {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background: #111;
}

.tile:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.tile iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
    display: block;
}

.tile-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 14px;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0) 55%
    );
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
}

/* ── OVERLAY ── */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 9999;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.overlay-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
}

.overlay.show .overlay-title {
    opacity: 1;
    transform: translateY(0);
}

/*
  The wrap is sized to the TRUE canvas dimensions via JS.
  transform-origin stays top-left so scale() shrinks it in-place;
  we then use negative margin to re-center it.
*/
.overlay-frame-wrap {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    opacity: 0;
    transform-origin: top left;
    transition: opacity 0.35s ease, transform 0.35s ease;
    /* width/height/transform set by JS */
}

.overlay.show .overlay-frame-wrap {
    opacity: 1;
}

.overlay-frame-wrap iframe {
    display: block;
    border: none;
    /* exact canvas size set by JS */
}

.overlay-hint {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    opacity: 0;
    transition: opacity 0.35s ease 0.2s;
}

.overlay.show .overlay-hint {
    opacity: 1;
}
</style>
</head>
<body>

<div class="page-header">
    <h1 class="page-title">p5.js Gallery</h1>
    <p class="page-subtitle">Click any sketch to expand</p>
</div>

<div class="gallery" id="gallery">
    <div class="tile" data-project="https://editor.p5js.org/Ace_number_1/embed/6iMF8HHqB" data-title="Rope Swing">
        <iframe src="https://editor.p5js.org/Ace_number_1/embed/6iMF8HHqB" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
        <div class="tile-label">Rope Swing</div>
    </div>
    <div class="tile" data-project="https://editor.p5js.org/Ace_number_1/embed/zVtp8zGmJ" data-title="Physics Sim">
        <iframe src="https://editor.p5js.org/Ace_number_1/embed/zVtp8zGmJ" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
        <div class="tile-label">Physics Sim</div>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-frame-wrap" id="frame-wrap">
        <iframe id="overlay-frame" src="" allow="autoplay"></iframe>
    </div>
    <div class="overlay-hint">Click anywhere or press Esc to close</div>
</div>

<script>
const overlay      = document.getElementById("overlay");
const overlayFrame = document.getElementById("overlay-frame");
const overlayTitle = document.getElementById("overlay-title");
const frameWrap    = document.getElementById("frame-wrap");

// Default size before postMessage arrives
let canvasW = 400, canvasH = 400;

function applySize(w, h) {
    canvasW = w;
    canvasH = h;

    // Set iframe and wrap to the TRUE canvas size — no squishing
    overlayFrame.style.width  = w + "px";
    overlayFrame.style.height = h + "px";
    frameWrap.style.width     = w + "px";
    frameWrap.style.height    = h + "px";

    // Scale the whole wrap down so it fits within 90% of the viewport
    const maxW  = window.innerWidth  * 0.9;
    const maxH  = (window.innerHeight * 0.9) - 80; // leave room for title/hint
    const scale = Math.min(1, maxW / w, maxH / h);

    // With transform-origin: top left, we shift by half the scaled-down delta
    // to keep it visually centered
    const dx = -(w * (1 - scale)) / 2;
    const dy = -(h * (1 - scale)) / 2;

    frameWrap.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
}

/* open */
document.querySelectorAll(".tile").forEach(tile => {
    tile.addEventListener("click", () => {
        // Reset to default size until postMessage arrives
        applySize(400, 400);
        frameWrap.style.transform = "translate(0,0) scale(0.6)"; // start collapsed

        overlayTitle.textContent = tile.dataset.title || "";
        overlayFrame.src = tile.dataset.project;
        overlay.classList.add("show");
    });
});

/* resize on postMessage from sketch */
window.addEventListener("message", e => {
    const { width, height } = e.data || {};
    if (!width || !height) return;
    applySize(width, height);
});

/* also re-apply on window resize */
window.addEventListener("resize", () => {
    if (overlay.classList.contains("show")) applySize(canvasW, canvasH);
});

/* close */
function closeOverlay() {
    overlay.classList.remove("show");
    setTimeout(() => {
        overlayFrame.src = "";
    }, 300);
}

overlay.addEventListener("click", closeOverlay);
document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeOverlay();
});
</script>

</body>
</html>
