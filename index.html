<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>p5.js Gallery</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    color: white;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at 50% 60%, #1a1a2e 0%, #0d0d1a 100%);
}

.page-header {
    text-align: center;
    padding: 60px 40px 20px;
}
.page-title {
    font-size: 52px;
    letter-spacing: 2px;
    margin: 0 0 8px;
    font-weight: 700;
}
.page-subtitle {
    font-size: 18px;
    color: rgba(255,255,255,0.45);
    margin: 0;
}

/* ── GALLERY ── */
.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
    padding: 40px 60px 80px;
}

.tile {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background: #111;
}
.tile:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.tile iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
    display: block;
}
.tile-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 55%);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
}

/* ── OVERLAY ── */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 9999;
}
.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.overlay-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
}
.overlay.show .overlay-title {
    opacity: 1;
    transform: translateY(0);
}

/*
  .overlay-frame-wrap is set to the DISPLAY size (scaled to fit viewport).
  The iframe inside is set to the TRUE canvas size, then shrunk via transform.
  This means the iframe renders at full resolution with no squishing,
  and the wrap is exactly the right visible size.
*/
.overlay-frame-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.35s ease;
    flex-shrink: 0;
}
.overlay.show .overlay-frame-wrap {
    opacity: 1;
}
#overlay-frame {
    display: block;
    border: none;
    transform-origin: top left;
    /* width, height, transform set by JS */
}

.overlay-hint {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    opacity: 0;
    transition: opacity 0.35s ease 0.2s;
}
.overlay.show .overlay-hint { opacity: 1; }
</style>
</head>
<body>

<div class="page-header">
    <h1 class="page-title">p5.js Gallery</h1>
    <p class="page-subtitle">Click any sketch to expand</p>
</div>

<!-- 
  data-w and data-h = the canvas size you used in createCanvas().
  The overlay will render at exactly that size (scaled down if needed to fit the screen).
-->
<div class="gallery" id="gallery">
    <div class="tile"
         data-src="https://editor.p5js.org/Ace_number_1/embed/6iMF8HHqB"
         data-title="Rope Swing"
         data-w="400" data-h="400">
        <iframe src="https://editor.p5js.org/Ace_number_1/embed/6iMF8HHqB" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
        <div class="tile-label">Rope Swing</div>
    </div>
    <div class="tile"
         data-src="https://editor.p5js.org/Ace_number_1/embed/zVtp8zGmJ"
         data-title="Physics Sim"
         data-w="640" data-h="640">
        <iframe src="https://editor.p5js.org/Ace_number_1/embed/zVtp8zGmJ" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
        <div class="tile-label">Physics Sim</div>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-frame-wrap" id="frame-wrap">
        <iframe id="overlay-frame" src="" allow="autoplay"></iframe>
    </div>
    <div class="overlay-hint">Click anywhere or press Esc to close</div>
</div>

<script>
const overlay      = document.getElementById("overlay");
const overlayFrame = document.getElementById("overlay-frame");
const overlayTitle = document.getElementById("overlay-title");
const frameWrap    = document.getElementById("frame-wrap");

function openSketch(src, title, canvasW, canvasH) {
    overlayTitle.textContent = title;
    overlayFrame.src = src;

    // Max available space (leave room for title + hint)
    const maxW = window.innerWidth  * 0.92;
    const maxH = window.innerHeight * 0.92 - 80;
    const scale = Math.min(1, maxW / canvasW, maxH / canvasH);

    const displayW = canvasW * scale;
    const displayH = canvasH * scale;

    // Wrap = the visible box size
    frameWrap.style.width  = displayW + "px";
    frameWrap.style.height = displayH + "px";

    // iframe = true canvas resolution, scaled down via CSS transform (no squish)
    overlayFrame.style.width     = canvasW + "px";
    overlayFrame.style.height    = canvasH + "px";
    overlayFrame.style.transform = `scale(${scale})`;

    overlay.classList.add("show");
}

document.querySelectorAll(".tile").forEach(tile => {
    tile.addEventListener("click", () => {
        openSketch(
            tile.dataset.src,
            tile.dataset.title || "",
            parseInt(tile.dataset.w) || 400,
            parseInt(tile.dataset.h) || 400
        );
    });
});

function closeOverlay() {
    overlay.classList.remove("show");
    setTimeout(() => { overlayFrame.src = ""; }, 300);
}

overlay.addEventListener("click", closeOverlay);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });
</script>

</body>
</html>
